# Regression on Windows and Linux. Place project-workbench/ at the repository root.
# Uses fixtures and a real Rscript only: no model, no account, no tunnel; network only for the setup actions.
name: regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: r-lib/actions/setup-r@v2
        # Enables tests/test_native_r.py (real Rscript, no model); it skips when R is absent.
        with:
          r-version: "release"
      - name: Git identity for disposable test repositories
        run: |
          git config --global user.name "Workbench CI"
          git config --global user.email "ci@example.invalid"
      - name: Compile
        run: python -m compileall -q workbench scripts tests spikes
      - name: Unit regression (ResourceWarning is an error)
        # The two POSIX process-lifecycle tests skip on Windows with their stated reason.
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
